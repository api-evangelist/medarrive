aid: medarrive
name: MedArrive
description: 'MedArrive is a healthcare technology company that provides a logistics
  and workforce platform for in-home care delivery. Its software gives health systems
  and in-home care providers smart scheduling, real-time provider routing, automated
  re-routing and patient reminders, and a live command-center dashboard for tracking
  every provider and visit, alongside a provider mobile app for field teams. The
  HIPAA-compliant platform is designed to reduce windshield time, cut scheduling
  effort, and increase daily visit capacity so care teams spend more time with
  patients and less on logistics. MedArrive is backed by Kleiner Perkins.'
